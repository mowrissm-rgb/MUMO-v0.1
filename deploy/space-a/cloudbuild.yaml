# Build + deploy Specialist A to Cloud Run.
#
# Build context is the REPO ROOT (src/ has to come along), while the Dockerfile
# lives under deploy/space-a/ — hence the explicit -f. Cloud Build does the
# building, so no local Docker daemon is needed.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/space-a/Dockerfile
      - -t
      - ${_IMAGE}
      - .

  - name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGE}"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - mumo-docking
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      # Docking is CPU-bound; 1 vCPU would roughly halve throughput.
      - --cpu=2
      - --memory=4Gi
      # A dock can legitimately run for many minutes. Cloud Run's ceiling is
      # 3600s; the service's own max_seconds guard sits below this.
      - --timeout=3600
      # Low concurrency on purpose: several simultaneous docks on 2 vCPU make
      # every one of them slower and risk the memory ceiling.
      - --concurrency=4
      - --max-instances=3
      # Scales to zero when idle, which is what keeps this free. The keep-warm
      # ping is what stops that becoming a cold start users notice.
      - --min-instances=0

substitutions:
  _REGION: us-central1
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/mumo/space-a:latest

images: ["${_IMAGE}"]
options:
  logging: CLOUD_LOGGING_ONLY
